name: Reporte diario

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  disparar:
    runs-on: ubuntu-latest
    steps:
      - name: Pedirle al ERP que mande el reporte
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 4 --retry-delay 20 --retry-all-errors \
            --max-time 180 \
            -X POST "${{ secrets.ERP_URL }}/cron/reporte-diario/" \
            -H "X-Cron-Token: ${{ secrets.CRON_TOKEN }}"